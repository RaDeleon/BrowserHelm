<rect x="82" y="289" width="4" height="25" rx="2" fill="#d7ad77"/>
<text x="98" y="310" fill="#f3eee6" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600">Claude</text>
<text x="86" y="346" fill="#b9c1ca" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400">Delegate public navigation</text>
<rect x="390" y="270" width="320" height="108" rx="14" fill="#222830" stroke="#39424c"/>
<rect x="408" y="289" width="4" height="25" rx="2" fill="#d7ad77"/>
<text x="424" y="310" fill="#f3eee6" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600">OpenRagnar</text>
<text x="412" y="346" fill="#b9c1ca" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400">Observe + verify link + text</text>
<rect x="770" y="270" width="290" height="108" rx="14" fill="#222830" stroke="#39424c"/>
<rect x="788" y="289" width="4" height="25" rx="2" fill="#d7ad77"/>
<text x="804" y="310" fill="#f3eee6" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600">Jev</text>
<text x="792" y="346" fill="#b9c1ca" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400">Bounded link choice</text>
<rect x="1150" y="270" width="386" height="108" rx="14" fill="#222830" stroke="#39424c"/>
<rect x="1168" y="289" width="4" height="25" rx="2" fill="#d7ad77"/>
<text x="1184" y="310" fill="#f3eee6" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600">Neo + page</text>
<text x="1172" y="346" fill="#b9c1ca" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400">Execute via OpenRagnar</text>
