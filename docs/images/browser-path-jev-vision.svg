<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1470" viewBox="0 0 1600 1470" role="img" aria-labelledby="title desc">
<title id="title">03  Jev + vision in one task</title><desc id="desc">Two existing tools, coordinated by Claude: navigation first, visual grounding when needed.. Includes savings mechanisms, verification and optional OpenViking memory.</desc>
<rect width="1600" height="1470" fill="#171b20"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#d7ad77"/></marker><marker id="return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#8cbde4"/></marker></defs>
<text x="64" y="52" fill="#d7ad77" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600">OPENRAGNAR / BROWSER EXECUTION</text>
<text x="64" y="111" fill="#f3eee6" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="600">03  Jev + vision in one task</text>
<text x="64" y="155" fill="#b9c1ca" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400">Two existing tools, coordinated by Claude: navigation first, visual grounding when needed.</text>
<text x="64" y="196" fill="#91c8a0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">IMPLEMENTED AS SEPARATE CALLS / NO AUTONOMOUS JEV + VISION LOOP</text>
<text x="64" y="247" fill="#d7ad77" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">A / NAVIGATE: openragnar_navigate</text>
